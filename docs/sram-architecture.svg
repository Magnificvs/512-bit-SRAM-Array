<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 373" width="900" height="373" role="img" aria-labelledby="title desc"><title id="title">512-bit SRAM: logical organization</title><desc id="desc">Three address bits select a row and two select a column group. Four 128-bit banks contribute four bits each to the sixteen-bit word.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path fill="#516784" d="M0 0L10 5L0 10z"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#172b45}.heading{font-size:25px;font-weight:700}.section{font-size:13px;font-weight:700;letter-spacing:1px}.label{font-size:15px;font-weight:700}.small{font-size:12px;fill:#455c79}.edge{stroke:#516784;stroke-width:2;fill:none}</style><rect x="1" y="1" width="898" height="371" rx="17" fill="#f6f9fd" stroke="#b8c9df"/><text x="28" y="40" class="heading">512-bit SRAM architecture</text><text x="28" y="63" class="small">45 nm CMOS · 32 words × 16 bits · transistor-level design</text><text x="28" y="101" class="section">5-BIT ADDRESS</text><rect x="274" y="82" width="346" height="234" rx="14" fill="#fff" stroke="#b8c9df"/><text x="447" y="108" text-anchor="middle" class="section">8 × 64 ARRAY OF 6T BITCELLS</text><text x="447" y="293" text-anchor="middle" class="small">4:1 column selection in each bank</text>
<g><rect x="28" y="115" width="182" height="81" rx="10" fill="#eaf3ff" stroke="#8db5e6"/><text x="119" y="152.5" text-anchor="middle" class="label">A[4:2]</text><text x="119" y="173.5" text-anchor="middle" class="small">3→8 row decoder</text></g>
<g><rect x="28" y="235" width="182" height="81" rx="10" fill="#eaf3ff" stroke="#8db5e6"/><text x="119" y="272.5" text-anchor="middle" class="label">A[1:0]</text><text x="119" y="293.5" text-anchor="middle" class="small">2→4 column decoder</text></g>
<g><rect x="293" y="127" width="148" height="63" rx="10" fill="#e8f8f2" stroke="#80c8b0"/><text x="367" y="155.5" text-anchor="middle" class="label">Bank 0 · 128 bits</text><text x="367" y="176.5" text-anchor="middle" class="small">8 rows × 16 columns</text></g>
<g><rect x="453" y="127" width="148" height="63" rx="10" fill="#e8f8f2" stroke="#80c8b0"/><text x="527" y="155.5" text-anchor="middle" class="label">Bank 1 · 128 bits</text><text x="527" y="176.5" text-anchor="middle" class="small">8 rows × 16 columns</text></g>
<g><rect x="293" y="202" width="148" height="63" rx="10" fill="#e8f8f2" stroke="#80c8b0"/><text x="367" y="230.5" text-anchor="middle" class="label">Bank 2 · 128 bits</text><text x="367" y="251.5" text-anchor="middle" class="small">8 rows × 16 columns</text></g>
<g><rect x="453" y="202" width="148" height="63" rx="10" fill="#e8f8f2" stroke="#80c8b0"/><text x="527" y="230.5" text-anchor="middle" class="label">Bank 3 · 128 bits</text><text x="527" y="251.5" text-anchor="middle" class="small">8 rows × 16 columns</text></g>
<g><rect x="676" y="138" width="196" height="120" rx="10" fill="#fff5e5" stroke="#e5b864"/><text x="774" y="195" text-anchor="middle" class="label">16-bit word I/O</text><text x="774" y="216" text-anchor="middle" class="small">4 bits per bank</text></g>
<path class="edge" marker-end="url(#arrow)" d="M210 156H272"/><path class="edge" marker-end="url(#arrow)" d="M210 276H272"/><path class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)" d="M622 198H674"/><text x="774" y="123" text-anchor="middle" class="section">DATA PATH</text><text x="774" y="279" text-anchor="middle" class="small">Read: sense &amp; latch</text><text x="774" y="298" text-anchor="middle" class="small">Write: drive bitline pairs</text><path d="M28 331H872" stroke="#ccd8e8"/><text x="28" y="353" class="small">Logical block diagram. Each address selects four bits from each of the four banks.</text></svg>
